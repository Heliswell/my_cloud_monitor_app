apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudmonitor-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-reader
rules:
- apiGroups: [""] # Core API group for pods
  resources: ["pods", "nodes", "namespaces"] # Expanded for future features
  verbs: ["get", "list", "watch"] # Watch allows for 'live' updates
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: read-pods-global
subjects:
- kind: ServiceAccount
  name: cloudmonitor-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io